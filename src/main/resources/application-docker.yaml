spring:
  datasource:
    # URL simplificada para evitar errores de metadatos/dialecto
    url: jdbc:h2:mem:caixabank;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate.default_schema: caixabank
  flyway:
    enabled: true
    schemas: caixabank
    locations:
      - classpath:db/flyway/h2
    # Al no poner URL aquí, Flyway usa el mismo DataSource que la app principal
    baseline-on-migrate: true
    default-schema: caixabank
