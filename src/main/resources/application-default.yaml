spring:
  cache:
    type: simple
  docker:
    compose:
      enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    # URL simplificada para evitar errores de metadatos/dialecto
    url: jdbc:h2:mem:caixabank;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate.default_schema: caixabank
  flyway:
    enabled: true
    schemas: caixabank
    locations:
      - classpath:db/flyway/h2
    # Al no poner URL aquí, Flyway usa el mismo DataSource que la app principal
    baseline-on-migrate: true
    default-schema: caixabank

logging:
  file:
    # Nombre y ruta del archivo de log donde se escribirán los mensajes.
    # Este archivo se creará en el directorio de ejecución de la aplicación.
    name: logs/app.log

  pattern:
    # Define el patrón de formato para los logs que se muestran en la consola.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"
    # Define el patrón de formato para los logs que se escriben en el archivo (logs/app.log).
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
