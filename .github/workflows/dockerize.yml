name: Dockerize

# Esta pipeline se ejecuta cuando:
on: 
  push:
    # Se hace push a ramas principales y de tipo release
    branches:
      - main
      - master
      - 'release/**'
  # Se ejecuta de forma manual
  workflow_dispatch:

# Variables de entorno globales de gh para el registro de contenedores
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Job para construir y subir la imagen Docker
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions: # Permisos necesarios para escribir en GHCR
      contents: read
      packages: write

    steps:
      # 1. Clonamos el repositorio
      - name: Git checkout
        uses: actions/checkout@v4

      # 2. Configuramos el entorno Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Verificación de tests
      - name: Unit Tests
        run: mvn test

      # 4. Preparar Docker Buildx para usar su sistema de caché
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Login en GHCR
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Generamos etiquetas y metadatos para la imagen
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # 7. Construcción y subida de la imagen Docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # --- MAGIA DE EFICIENCIA AQUÍ ---
          # 'cache-from' intenta leer las capas del Dockerfile desde GitHub Actions
          # 'cache-to' guarda las capas construidas para la siguiente vez
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 8. Escaneamos las vulnerabilidades con Trivy
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: 'table'
          severity: 'CRITICAL,HIGH'