version: '3.8'

services:
  # MySQL para persistencia de datos
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=caixabank
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  #Cliente de MySQL
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver
    ports:
      - "8978:8978"
    depends_on:
      - mysql

  # Redis para cache
  redis:
    image: redis:alpine
    container_name: redis-cache
    ports:
      - "6379:6379"

  # Cliente de redis
  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "5540:5540"
    depends_on:
      - redis
        
  # Prometheus para monitoreo
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'
    volumes:
      # Referencia a tu nueva carpeta 'compose-config'
      - ./compose-config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  # Grafana para dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - ./compose-config/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - loki
      - tempo
      - prometheus

  # Loki para logs
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./compose-config/loki/loki.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml

  # Promtail para recopilar logs
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./logs:/logs
      - ./compose-config/promtail/promtail.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # Tempo para tracing
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    volumes:
      - ./compose-config/tempo/tempo.yml:/etc/tempo.yaml
    command: [ "-config.file=/etc/tempo.yaml" ]
    ports:
      - "3200:3200" 
      - "4317:4317"
      - "4318:4318"

  # SonarQube para análisis estático
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    volumes:
      - ./sonar-config/data:/opt/sonarqube/data
      - ./sonar-config/extensions:/opt/sonarqube/extensions
      - ./sonar-config/conf:/opt/sonarqube/conf
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true

  # Checkmarx KICS para seguridad
  checkmarx-kics:
    image: checkmarx/kics:latest
    container_name: kics
    volumes:
      - .:/path
    command: scan -p /path -o /path/checkmarx-results/ --report-formats json,html --output-name results
    #command: scan -p /path -o /path/kics-results.json

networks:
  default:
    name: caixabank-network